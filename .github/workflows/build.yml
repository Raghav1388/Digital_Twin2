name: Build PACKTWIN installers

# Run this manually from the "Actions" tab on GitHub (click "Run workflow"),
# or it runs automatically whenever you push changes.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows .exe
        run: pyinstaller --noconfirm --onefile --windowed --name PACKTWIN --add-data "sample_bms_log.csv;." --add-data "assets;assets" main.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PACKTWIN-Windows
          path: dist/PACKTWIN.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Mac .app
        run: pyinstaller --noconfirm --windowed --name PACKTWIN --add-data "sample_bms_log.csv:." --add-data "assets:assets" main.py
      - name: Zip the .app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/PACKTWIN.app PACKTWIN-Mac.zip
      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: PACKTWIN-Mac
          path: PACKTWIN-Mac.zip
